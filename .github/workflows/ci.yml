name: CI

on:
  push:
    # "**" also matches branch names with slashes, so every pushed branch runs.
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The SDK every job builds: Titan's Lua fork, stock LuaRocks, and the
  # Titan release source rock, in the validation profile.
  LUA_RELEASE: v5.5.1-1
  LUAROCKS_VERSION: "3.13.0"
  TITAN_RELEASE: v0.6.1
  TITAN_ROCK: titan-0.6.1-1.src.rock
  TITAN_BUILD_PROFILE: validation
  # titan-mk comes from the mascarenhas/mk GitHub release until it is
  # published on LuaRocks.
  MK_RELEASE: v0.1.0
  MK_ROCK: titan-mk-0.1.0-1.src.rock

jobs:
  linux:
    name: Linux x64 (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      OPENSSL_MODE: system
      TITAN_JOBS: "4"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build and test prerequisites
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            build-essential ca-certificates cmake curl git libreadline-dev libssl-dev \
            pkg-config unzip
          echo "TITAN_PREFIX=$RUNNER_TEMP/titan-sdk" >> "$GITHUB_ENV"

      # A release can be re-cut under the same tag: the cache names the exact
      # source rock digest and the commit the tag currently selects.
      - name: Identify the Titan release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: &identify-release |
          set -euo pipefail
          # Strip CR: on Windows this runs in Git Bash around the native gh.exe.
          commit=$(gh api "repos/mascarenhas/titan/commits/$TITAN_RELEASE" --jq '.sha' | tr -d '\r')
          [[ $commit =~ ^[0-9a-f]{40}$ ]]
          digest=$(gh api "repos/mascarenhas/titan/releases/tags/$TITAN_RELEASE" --jq "
            [.assets[] | select(.name == \"$TITAN_ROCK\")] | select(length == 1) | first |
            .digest | select(type == \"string\" and test(\"^sha256:[0-9a-f]{64}$\")) |
            sub(\"^sha256:\"; \"\")" | tr -d '\r')
          [[ $digest =~ ^[0-9a-f]{64}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "rock-sha256=$digest" >> "$GITHUB_OUTPUT"

      # titan-mk is verified the same way: the commit its tag selects and the
      # digest of its single source rock asset.
      - name: Identify the titan-mk release
        id: mk-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: &identify-mk-release |
          set -euo pipefail
          # Strip CR: on Windows this runs in Git Bash around the native gh.exe.
          commit=$(gh api "repos/mascarenhas/mk/commits/$MK_RELEASE" --jq '.sha' | tr -d '\r')
          [[ $commit =~ ^[0-9a-f]{40}$ ]]
          digest=$(gh api "repos/mascarenhas/mk/releases/tags/$MK_RELEASE" --jq "
            [.assets[] | select(.name == \"$MK_ROCK\")] | select(length == 1) | first |
            .digest | select(type == \"string\" and test(\"^sha256:[0-9a-f]{64}$\")) |
            sub(\"^sha256:\"; \"\")" | tr -d '\r')
          [[ $digest =~ ^[0-9a-f]{64}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "rock-sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Identify the native toolchain
        id: toolchain
        run: |
          set -euo pipefail
          {
            cat /etc/os-release
            cc --version
            dpkg-query -W -f='${Package} ${Version}\n' libc6-dev libreadline-dev libssl-dev
            printf '%s\n' "$TITAN_PREFIX"
          } | tee "$RUNNER_TEMP/titan-toolchain"
          echo "digest=$(sha256sum "$RUNNER_TEMP/titan-toolchain" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # No fallback keys: another source rock or toolchain is never a valid
      # hit. Bump layout-v1 when the install recipe or cached layout changes.
      - name: Restore the Titan SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TITAN_PREFIX }}
          key: titan-sdk-layout-v1-ubuntu-24.04-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-openssl-${{ env.OPENSSL_MODE }}-lua-${{ env.LUA_RELEASE }}-luarocks-${{ env.LUAROCKS_VERSION }}-${{ env.TITAN_RELEASE }}-${{ steps.release.outputs.commit }}-rock-${{ steps.release.outputs.rock-sha256 }}-toolchain-${{ steps.toolchain.outputs.digest }}

      - name: Build Lua, LuaRocks, and the Titan release rock
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          ROCK_SHA256: ${{ steps.release.outputs.rock-sha256 }}
        run: |
          set -euo pipefail
          sources="$RUNNER_TEMP/titan-sources"
          mkdir -p "$sources/lua"
          cd "$sources"
          curl -fL --retry 3 -o lua.tar.gz \
            "https://github.com/mascarenhas/lua-5.5.1/archive/refs/tags/$LUA_RELEASE.tar.gz"
          tar -xzf lua.tar.gz --strip-components=1 -C lua
          make -C lua -j4 linux-readline PREFIX="$TITAN_PREFIX" \
            MYCFLAGS='-O2 -fno-lto' MYLDFLAGS='-O2 -fno-lto'
          make -C lua install PREFIX="$TITAN_PREFIX"
          curl -fL --retry 3 -o luarocks.tar.gz \
            "https://luarocks.org/releases/luarocks-$LUAROCKS_VERSION.tar.gz"
          tar -xzf luarocks.tar.gz
          (cd "luarocks-$LUAROCKS_VERSION" &&
            ./configure --prefix="$TITAN_PREFIX" --rocks-tree="$TITAN_PREFIX" \
              --with-lua="$TITAN_PREFIX" --force-config &&
            make LUA_DIR="$TITAN_PREFIX" &&
            make install LUA_DIR="$TITAN_PREFIX")
          curl -fL --retry 3 -o "$TITAN_ROCK" \
            "https://github.com/mascarenhas/titan/releases/download/$TITAN_RELEASE/$TITAN_ROCK"
          echo "$ROCK_SHA256  $TITAN_ROCK" | sha256sum --check --strict
          PATH="$TITAN_PREFIX/bin:$PATH" "$TITAN_PREFIX/bin/luarocks" install "$TITAN_ROCK"

      - name: Validate the Titan SDK
        run: &validate-unix-sdk |
          set -euo pipefail
          test -x "$TITAN_PREFIX/bin/titanc"
          test -s "$TITAN_PREFIX/lib/titan/0.6/titan.a"
          test -s "$TITAN_PREFIX/lib/titan/0.6/libtitan.a"
          test "$(cat "$TITAN_PREFIX/etc/titan/build-profile")" = "$TITAN_BUILD_PROFILE"
          test "$("$TITAN_PREFIX/bin/titanc" --print-root)" = "$TITAN_PREFIX"
          echo "$TITAN_PREFIX/bin" >> "$GITHUB_PATH"

      # Save the bare SDK, before titan-mk and foundry-relay are installed.
      - name: Save the Titan SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TITAN_PREFIX }}
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      # From the mascarenhas/mk GitHub release until titan-mk is on LuaRocks.
      - name: Install the titan-mk release rock
        env:
          MK_COMMIT: ${{ steps.mk-release.outputs.commit }}
          MK_ROCK_SHA256: ${{ steps.mk-release.outputs.rock-sha256 }}
        run: |
          set -euo pipefail
          echo "titan-mk $MK_RELEASE at $MK_COMMIT"
          mkdir -p "$RUNNER_TEMP/titan-mk"
          cd "$RUNNER_TEMP/titan-mk"
          curl -fL --retry 3 -o "$MK_ROCK" \
            "https://github.com/mascarenhas/mk/releases/download/$MK_RELEASE/$MK_ROCK"
          echo "$MK_ROCK_SHA256  $MK_ROCK" | sha256sum --check --strict
          luarocks install "$MK_ROCK"
          test -f "$TITAN_PREFIX/lib/titan/0.6/mk.so"
          test -f "$TITAN_PREFIX/lib/titan/0.6/mk.a"

      - name: Lint the rockspec
        run: luarocks lint foundry-relay-0.1.0-1.rockspec

      - name: Build and run the relay test suite
        run: luarocks test foundry-relay-0.1.0-1.rockspec

      - name: Install, run, and remove the foundry-relay rock
        run: bash .github/scripts/package-smoke.sh "$RUNNER_TEMP/fr-package-smoke"

  macos:
    name: macOS arm64 (macos-15)
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      OPENSSL_MODE: system
      TITAN_JOBS: "3"

    steps:
      - name: Install build prerequisites
        run: |
          brew install cmake make openssl@3 pkgconf readline
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          {
            # Homebrew's openssl@3 is keg-only; system-OpenSSL mode finds it here.
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig"
            echo "TMPDIR=$(mktemp -d /private/tmp/fr-ci.XXXXXX)"
            echo "TITAN_PREFIX=$RUNNER_TEMP/titan-sdk"
            # /usr/bin/openssl is LibreSSL; the RSA-OAEP interoperability
            # cases in tests/session_crypto_test.titan need OpenSSL 3.
            echo "RELAY_TEST_OPENSSL=$(brew --prefix openssl@3)/bin/openssl"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Identify the Titan release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: *identify-release

      - name: Identify the titan-mk release
        id: mk-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: *identify-mk-release

      - name: Identify the native toolchain
        id: toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          {
            sw_vers
            cc --version
            xcrun --show-sdk-path
            make --version
            brew list --versions cmake make openssl@3 pkgconf readline
            printf '%s\n' "$TITAN_PREFIX"
          } | tee "$RUNNER_TEMP/titan-toolchain"
          echo "digest=$(shasum -a 256 "$RUNNER_TEMP/titan-toolchain" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # No fallback keys. Bump layout-v1 when the install recipe or cached
      # layout changes.
      - name: Restore the Titan SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TITAN_PREFIX }}
          key: titan-sdk-layout-v1-macos-15-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-openssl-${{ env.OPENSSL_MODE }}-lua-${{ env.LUA_RELEASE }}-luarocks-${{ env.LUAROCKS_VERSION }}-${{ env.TITAN_RELEASE }}-${{ steps.release.outputs.commit }}-rock-${{ steps.release.outputs.rock-sha256 }}-toolchain-${{ steps.toolchain.outputs.digest }}

      - name: Build Lua, LuaRocks, and the Titan release rock
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          ROCK_SHA256: ${{ steps.release.outputs.rock-sha256 }}
        run: |
          set -euo pipefail
          readline=$(brew --prefix readline)
          sources="$RUNNER_TEMP/titan-sources"
          mkdir -p "$sources/lua"
          cd "$sources"
          curl -fL --retry 3 -o lua.tar.gz \
            "https://github.com/mascarenhas/lua-5.5.1/archive/refs/tags/$LUA_RELEASE.tar.gz"
          tar -xzf lua.tar.gz --strip-components=1 -C lua
          make -C lua -j3 macosx PREFIX="$TITAN_PREFIX" \
            MYCFLAGS="-O2 -fno-lto -I$readline/include" \
            MYLDFLAGS="-O2 -fno-lto -L$readline/lib"
          make -C lua install PREFIX="$TITAN_PREFIX"
          curl -fL --retry 3 -o luarocks.tar.gz \
            "https://luarocks.org/releases/luarocks-$LUAROCKS_VERSION.tar.gz"
          tar -xzf luarocks.tar.gz
          (cd "luarocks-$LUAROCKS_VERSION" &&
            ./configure --prefix="$TITAN_PREFIX" --rocks-tree="$TITAN_PREFIX" \
              --with-lua="$TITAN_PREFIX" --force-config &&
            make LUA_DIR="$TITAN_PREFIX" &&
            make install LUA_DIR="$TITAN_PREFIX")
          curl -fL --retry 3 -o "$TITAN_ROCK" \
            "https://github.com/mascarenhas/titan/releases/download/$TITAN_RELEASE/$TITAN_ROCK"
          echo "$ROCK_SHA256  $TITAN_ROCK" | shasum -a 256 --check --strict
          PATH="$TITAN_PREFIX/bin:$PATH" "$TITAN_PREFIX/bin/luarocks" install "$TITAN_ROCK"

      - name: Validate the Titan SDK
        run: *validate-unix-sdk

      - name: Save the Titan SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TITAN_PREFIX }}
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      # From the mascarenhas/mk GitHub release until titan-mk is on LuaRocks.
      - name: Install the titan-mk release rock
        env:
          MK_COMMIT: ${{ steps.mk-release.outputs.commit }}
          MK_ROCK_SHA256: ${{ steps.mk-release.outputs.rock-sha256 }}
        run: |
          set -euo pipefail
          echo "titan-mk $MK_RELEASE at $MK_COMMIT"
          mkdir -p "$RUNNER_TEMP/titan-mk"
          cd "$RUNNER_TEMP/titan-mk"
          curl -fL --retry 3 -o "$MK_ROCK" \
            "https://github.com/mascarenhas/mk/releases/download/$MK_RELEASE/$MK_ROCK"
          echo "$MK_ROCK_SHA256  $MK_ROCK" | shasum -a 256 --check --strict
          luarocks install "$MK_ROCK"
          test -f "$TITAN_PREFIX/lib/titan/0.6/mk.so"
          test -f "$TITAN_PREFIX/lib/titan/0.6/mk.a"

      - name: Lint the rockspec
        run: luarocks lint foundry-relay-0.1.0-1.rockspec

      - name: Build and run the relay test suite
        run: luarocks test foundry-relay-0.1.0-1.rockspec

      - name: Install, run, and remove the foundry-relay rock
        run: bash .github/scripts/package-smoke.sh "$RUNNER_TEMP/fr-package-smoke"

  windows:
    name: Windows x64 CLANG64 (windows-2025-vs2026)
    runs-on: windows-2025-vs2026
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
        working-directory: C:/fr-ci
    env:
      TITAN_PREFIX: C:/titan-sdk
      LUAROCKS_CONFIG: C:/titan-sdk/etc/luarocks/config-5.5.lua
      OPENSSL_MODE: bundled
      TITAN_JOBS: "4"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          persist-credentials: false

      - name: Install MSYS2 CLANG64 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          location: C:/fr-msys2
          cache: true
          install: >-
            git make perl curl tar unzip
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-make
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-openssl

      # The relay's filesystem and SQLite tests need a fixed NTFS volume; D:
      # may be ReFS.
      - name: Stage the checkout on local NTFS
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test ! -e /c/fr-ci
          cp -a . /c/fr-ci
          df -h /c

      - name: Identify the Titan release
        id: release
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: *identify-release

      - name: Identify the titan-mk release
        id: mk-release
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: *identify-mk-release

      - name: Identify the CLANG64 toolchain
        id: toolchain
        run: |
          set -euo pipefail
          digest=$({
            cygpath -m "$TITAN_PREFIX"
            cygpath -m /clang64
            uname -r
            pacman -Q
          } | tee /tmp/titan-windows-toolchain | sha256sum | cut -d' ' -f1)
          echo "digest=$digest" >> "$(cygpath -u "$GITHUB_OUTPUT")"

      # No fallback keys. Bump layout-v1 when the install recipe or cached
      # layout changes.
      - name: Restore the Titan SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: C:/titan-sdk
          key: titan-sdk-layout-v1-windows-2025-vs2026-${{ runner.arch }}-CLANG64-${{ env.TITAN_BUILD_PROFILE }}-openssl-${{ env.OPENSSL_MODE }}-${{ env.TITAN_RELEASE }}-${{ steps.release.outputs.commit }}-rock-${{ steps.release.outputs.rock-sha256 }}-toolchain-${{ steps.toolchain.outputs.digest }}

      # The source rock carries the Titan tree, Makefile.win, and the Lua
      # sources; Makefile.win builds lua55.dll, LuaRocks, and the compiler
      # into one SDK prefix.
      - name: Build Lua, LuaRocks, and Titan from the release rock
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: C:/
        env:
          ROCK_SHA256: ${{ steps.release.outputs.rock-sha256 }}
        run: |
          set -euo pipefail
          unset LD
          export PATH="/clang64/bin:$PATH"
          mkdir -p /c/titan-src
          cd /c/titan-src
          curl -fL --retry 3 -o "$TITAN_ROCK" \
            "https://github.com/mascarenhas/titan/releases/download/$TITAN_RELEASE/$TITAN_ROCK"
          echo "$ROCK_SHA256  $TITAN_ROCK" | sha256sum --check --strict
          unzip -q "$TITAN_ROCK"
          cd titan
          mingw32-make -f Makefile.win lua luarocks compiler \
            PREFIX="$TITAN_PREFIX" OPENSSL_MODE="$OPENSSL_MODE" \
            TITAN_BUILD_PROFILE="$TITAN_BUILD_PROFILE"

      - name: Validate the Titan SDK
        run: |
          set -euo pipefail
          sdk=$(cygpath -u "$TITAN_PREFIX")
          test -x "$sdk/bin/titanc.exe"
          test -f "$sdk/bin/lua55.dll"
          test -f "$sdk/lib/titan/0.6/titan.dll"
          # Native Windows programs end lines with CRLF.
          test "$(tr -d '\r' < "$sdk/etc/titan/build-profile")" = "$TITAN_BUILD_PROFILE"
          root=$("$sdk/bin/titanc.exe" --print-root | tr -d '\r')
          test "$(cygpath -m "$root")" = "$(cygpath -m "$TITAN_PREFIX")"

      # Save the bare SDK, before titan-mk and foundry-relay are installed.
      - name: Save the Titan SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:/titan-sdk
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      # From the mascarenhas/mk GitHub release until titan-mk is on LuaRocks;
      # its post_install hook publishes mk.dll through titan-install.
      - name: Install the titan-mk release rock
        env:
          MK_COMMIT: ${{ steps.mk-release.outputs.commit }}
          MK_ROCK_SHA256: ${{ steps.mk-release.outputs.rock-sha256 }}
        run: |
          set -euo pipefail
          unset LD
          export PATH="$(cygpath -u "$TITAN_PREFIX")/bin:/clang64/bin:$PATH"
          echo "titan-mk $MK_RELEASE at $MK_COMMIT"
          mkdir -p /c/titan-mk
          cd /c/titan-mk
          curl -fL --retry 3 -o "$MK_ROCK" \
            "https://github.com/mascarenhas/mk/releases/download/$MK_RELEASE/$MK_ROCK"
          echo "$MK_ROCK_SHA256  $MK_ROCK" | sha256sum --check --strict
          luarocks.exe --lua-version=5.5 --tree="$TITAN_PREFIX" install "$MK_ROCK"
          test -f "$(cygpath -u "$TITAN_PREFIX")/lib/titan/0.6/mk.dll"

      - name: Lint the rockspec
        run: |
          set -euo pipefail
          export PATH="$(cygpath -u "$TITAN_PREFIX")/bin:/clang64/bin:$PATH"
          luarocks.exe --lua-version=5.5 --tree="$TITAN_PREFIX" lint foundry-relay-0.1.0-1.rockspec

      # Builds the relocatable application and test payloads, audits every PE
      # import table, relocates the application to a Unicode path without the
      # SDK or toolchain on PATH, and runs the suite from its payload.
      - name: Build, relocate, and check the Windows payloads
        run: |
          set -euo pipefail
          unset LD
          export PATH="$(cygpath -u "$TITAN_PREFIX")/bin:/clang64/bin:$PATH"
          export RELAY_TEST_OPENSSL="$(cygpath -w /clang64/bin/openssl.exe)"
          make -f Makefile.windows PREFIX="$(cygpath -u "$TITAN_PREFIX")" test

      - name: Build and run the relay test suite
        run: |
          set -euo pipefail
          unset LD
          export PATH="$(cygpath -u "$TITAN_PREFIX")/bin:/clang64/bin:$PATH"
          export RELAY_TEST_OPENSSL="$(cygpath -w /clang64/bin/openssl.exe)"
          luarocks.exe --lua-version=5.5 --tree="$TITAN_PREFIX" test foundry-relay-0.1.0-1.rockspec

      - name: Install, run, and remove the foundry-relay rock
        run: |
          set -euo pipefail
          unset LD
          export PATH="$(cygpath -u "$TITAN_PREFIX")/bin:/clang64/bin:$PATH"
          bash .github/scripts/package-smoke.sh /c/fr-package-smoke
